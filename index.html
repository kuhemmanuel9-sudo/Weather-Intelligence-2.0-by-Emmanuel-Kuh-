<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Weather Intelligence is a live weather dashboard designed and developed by Emmanuel Kuh.">
  <meta name="theme-color" content="#f6f7fb">
  <title>Weather Intelligence by Emmanuel Kuh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-soft: #eef4f7;
      --surface-strong: #e7edf2;
      --text: #17202a;
      --muted: #5b6775;
      --subtle: #7a8695;
      --line: #d7dfe8;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #0f8a5f;
      --green-soft: #e3f5ec;
      --amber: #b45309;
      --amber-soft: #fff4dd;
      --red: #c24132;
      --red-soft: #fde8e4;
      --blue-soft: #e8f1ff;
      --purple: #6d5bd0;
      --shadow: 0 18px 50px rgba(23, 32, 42, 0.08);
      --shadow-strong: 0 24px 80px rgba(23, 32, 42, 0.13);
      --premium-line: rgba(37, 99, 235, 0.28);
      --radius: 8px;
      --focus: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #141615;
      --surface: #1d211f;
      --surface-soft: #252b28;
      --surface-strong: #303832;
      --text: #f4f7f2;
      --muted: #bcc8bf;
      --subtle: #8f9d94;
      --line: #3b453f;
      --primary: #7ab8ff;
      --primary-dark: #9dccff;
      --green: #63d69c;
      --green-soft: #203c30;
      --amber: #f2bd62;
      --amber-soft: #3c3120;
      --red: #f28b82;
      --red-soft: #432621;
      --blue-soft: #203244;
      --purple: #b7a9ff;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      --shadow-strong: 0 24px 80px rgba(0, 0, 0, 0.42);
      --premium-line: rgba(122, 184, 255, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(125deg, rgba(37, 99, 235, 0.13), transparent 36%),
        linear-gradient(245deg, rgba(15, 138, 95, 0.12), transparent 34%),
        linear-gradient(180deg, rgba(109, 91, 208, 0.07), transparent 54%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    body.is-loading {
      cursor: progress;
    }

    .weather-atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.62;
    }

    .weather-atmosphere span {
      position: absolute;
      display: block;
      opacity: 0;
    }

    body[data-weather="rain"] .weather-atmosphere span {
      top: -18%;
      width: 1px;
      height: 80px;
      background: linear-gradient(180deg, rgba(122, 184, 255, 0), rgba(122, 184, 255, 0.55));
      animation: rainFall 1.2s linear infinite;
      opacity: 1;
    }

    body[data-weather="snow"] .weather-atmosphere span {
      top: -8%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(244, 247, 242, 0.78);
      animation: snowDrift 8s linear infinite;
      opacity: 1;
    }

    body[data-weather="sun"] .weather-atmosphere::before {
      content: "";
      position: absolute;
      width: 46vw;
      height: 46vw;
      min-width: 300px;
      min-height: 300px;
      right: -15vw;
      top: -18vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(242, 189, 98, 0.24), transparent 68%);
      animation: sunPulse 9s ease-in-out infinite;
    }

    body[data-weather="storm"] .weather-atmosphere::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(122, 184, 255, 0);
      animation: stormFlash 7s linear infinite;
    }

    @keyframes rainFall {
      from { transform: translateY(-10vh) rotate(10deg); }
      to { transform: translateY(125vh) rotate(10deg); }
    }

    @keyframes snowDrift {
      from { transform: translate3d(0, -10vh, 0); }
      to { transform: translate3d(42px, 115vh, 0); }
    }

    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: 0.72; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes stormFlash {
      0%, 92%, 100% { background: rgba(122, 184, 255, 0); }
      94% { background: rgba(122, 184, 255, 0.18); }
      96% { background: rgba(244, 247, 242, 0.1); }
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--primary);
    }

    .skip-link {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 30;
      transform: translateY(-140%);
      background: var(--surface);
      color: var(--text);
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .skip-link:focus {
      transform: translateY(0);
      box-shadow: var(--focus);
    }

    .app-shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
      position: relative;
      z-index: 1;
    }

    .app-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.08), transparent 42%),
        linear-gradient(315deg, rgba(15, 138, 95, 0.08), transparent 38%),
        var(--surface);
      border: 1px solid var(--premium-line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-strong);
      position: relative;
      overflow: hidden;
    }

    .app-header::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--green), var(--purple));
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--primary), var(--green));
      color: #ffffff;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.24);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.5vw, 2.2rem);
      line-height: 1.1;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
    }

    .credit {
      font-weight: 700;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pill,
    .button,
    .icon-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--text);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      font-weight: 700;
    }

    .voice-select {
      min-height: 40px;
      max-width: 190px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--text);
      padding: 0 34px 0 12px;
      font-weight: 800;
      outline: none;
    }

    .voice-choice {
      max-width: 280px;
    }

    .voice-select:focus {
      box-shadow: var(--focus);
      border-color: var(--primary);
    }

    .button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .button.primary:hover,
    .button.primary:focus-visible {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .button.active {
      background: var(--green);
      border-color: var(--green);
      color: #ffffff;
    }

    .button.danger {
      background: var(--red);
      border-color: var(--red);
      color: #ffffff;
    }

    .button.ghost {
      background: transparent;
    }

    .button:hover,
    .pill:hover,
    .icon-button:hover {
      border-color: var(--primary);
    }

    .button:active,
    .icon-button:active {
      transform: translateY(1px);
    }

    .button:focus-visible,
    .icon-button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .button[disabled] {
      cursor: wait;
      opacity: 0.65;
    }

    .segmented {
      display: inline-flex;
      padding: 4px;
      gap: 4px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .segmented button {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 5px 10px;
      font-weight: 700;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--primary);
      color: #ffffff;
    }

    .layout {
      display: grid;
      gap: 18px;
    }

    .toolbar,
    .panel,
    .current-card,
    .metric-card,
    .forecast-card,
    .analysis-card,
    .compare-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar {
      padding: 16px;
    }

    .search-form {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 10px;
      align-items: center;
    }

    .search-field,
    .select-field {
      position: relative;
      min-width: 0;
    }

    .search-field label,
    .compare-form label,
    .select-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .search-field input,
    .compare-form input,
    .select-field select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--text);
      padding: 10px 12px;
    }

    .state-browser {
      display: grid;
      grid-template-columns: minmax(220px, 0.8fr) minmax(320px, 1.4fr);
      gap: 16px;
      align-items: start;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.09), transparent 42%),
        var(--surface-soft);
    }

    .state-browser h3 {
      margin: 0 0 5px;
      font-size: 1.05rem;
    }

    .state-browser p {
      margin: 0;
      color: var(--muted);
    }

    .global-explorer {
      display: grid;
      grid-template-columns: minmax(220px, 0.75fr) minmax(320px, 1.25fr);
      gap: 16px;
      align-items: start;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--premium-line);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(109, 91, 208, 0.11), transparent 40%),
        linear-gradient(315deg, rgba(15, 138, 95, 0.09), transparent 36%),
        var(--surface);
      box-shadow: var(--shadow);
    }

    .global-explorer h3 {
      margin: 0 0 5px;
      font-size: 1.05rem;
    }

    .global-explorer p {
      margin: 0;
      color: var(--muted);
    }

    .world-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .state-picker-grid {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(180px, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .city-strip {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .city-strip .chip {
      background: var(--surface);
    }

    .place-results {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .place-results.show {
      display: flex;
    }

    .place-results .result-button {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 260px;
      min-height: 54px;
      text-align: left;
    }

    .place-results .result-button span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .suggestions,
    .favorites {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      align-items: center;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.92rem;
    }

    .chip:hover,
    .chip:focus-visible {
      border-color: var(--primary);
    }

    .chip .remove {
      margin-left: 8px;
      color: var(--red);
      font-weight: 800;
    }

    .favorite-chip {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .favorite-chip .chip {
      min-height: 36px;
    }

    .favorite-chip .remove-button {
      width: 36px;
      padding: 7px 0;
      color: var(--red);
      font-weight: 800;
    }

    .section-label {
      color: var(--muted);
      font-weight: 700;
      margin-right: 2px;
    }

    .status-line {
      display: none;
      padding: 11px 13px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
    }

    .status-line.show {
      display: block;
    }

    .status-line.error {
      border-color: rgba(194, 65, 50, 0.35);
      background: var(--red-soft);
      color: var(--red);
    }

    .status-line.success {
      border-color: rgba(15, 138, 95, 0.35);
      background: var(--green-soft);
      color: var(--green);
    }

    .executive-strip {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(5, minmax(120px, 1fr));
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--premium-line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.12), transparent 50%),
        var(--surface);
      box-shadow: var(--shadow-strong);
    }

    .exec-cell {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      min-width: 0;
    }

    .exec-cell span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .exec-cell strong {
      display: block;
      margin-top: 2px;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      line-height: 1.05;
    }

    .nowcast-panel {
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.35fr);
      gap: 18px;
      border-color: var(--premium-line);
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.09), transparent 42%),
        var(--surface);
    }

    .snow-panel {
      border-color: rgba(37, 99, 235, 0.34);
      background:
        linear-gradient(135deg, rgba(232, 241, 255, 0.92), transparent 46%),
        linear-gradient(245deg, rgba(15, 138, 95, 0.08), transparent 44%),
        var(--surface);
    }

    [data-theme="dark"] .snow-panel {
      background:
        linear-gradient(135deg, rgba(122, 184, 255, 0.14), transparent 46%),
        linear-gradient(245deg, rgba(15, 138, 95, 0.1), transparent 44%),
        var(--surface);
    }

    .nowcast-copy {
      margin: 0;
      color: var(--muted);
    }

    .rain-timeline,
    .snow-timeline {
      display: grid;
      gap: 8px;
    }

    .rain-slot,
    .snow-slot {
      display: grid;
      grid-template-columns: 76px 1fr 64px;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .rain-slot time,
    .rain-slot strong,
    .snow-slot time,
    .snow-slot strong {
      color: var(--muted);
      font-weight: 800;
    }

    .rain-bar,
    .snow-bar {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface-strong);
    }

    .rain-bar span,
    .snow-bar span {
      display: block;
      width: var(--bar-width, var(--rain-width, 0%));
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--purple));
    }

    .snow-bar span {
      background: linear-gradient(90deg, #7ab8ff, #f4f7f2);
    }

    .hourly-weather {
      display: grid;
      grid-template-columns: repeat(8, minmax(112px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .hour-card,
    .pollutant-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .hour-card time,
    .pollutant-card span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .hour-card strong,
    .pollutant-card strong {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: 1.04rem;
    }

    .hour-card p,
    .pollutant-card p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .pollutant-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(135px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(300px, 1.4fr);
      gap: 18px;
    }

    .current-card {
      padding: 22px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .location-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .location-row h2 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 1.85rem);
      line-height: 1.15;
    }

    .location-row p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .current-temp {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }

    .current-temp strong {
      font-size: clamp(3.1rem, 7vw, 5.4rem);
      line-height: 0.95;
    }

    .condition {
      padding-bottom: 9px;
      color: var(--muted);
      font-weight: 700;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mini {
      padding: 11px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .mini span {
      display: block;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .mini strong {
      display: block;
      margin-top: 2px;
      font-size: 1.05rem;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .metric-card {
      min-height: 138px;
      padding: 15px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .metric-card span {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .metric-card strong {
      font-size: clamp(1.45rem, 2.4vw, 2.1rem);
      line-height: 1;
    }

    .metric-card p {
      margin: 0;
      color: var(--subtle);
      font-size: 0.9rem;
    }

    .recommendation {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px;
      border-left: 5px solid var(--primary);
    }

    .recommendation.warning {
      border-left-color: var(--amber);
    }

    .recommendation.danger {
      border-left-color: var(--red);
    }

    .recommendation h2,
    .panel h2,
    .about h2,
    .compare h2 {
      margin: 0 0 8px;
      font-size: clamp(1.1rem, 2vw, 1.35rem);
    }

    .recommendation p,
    .about p,
    .panel-intro {
      margin: 0;
      color: var(--muted);
    }

  <!-- RAIN MESSAGE HELPER: updates the UI to show "It's raining here" when appropriate -->
  <script>
  (function(){
    const RAIN_THRESHOLD = 50; // percent threshold to treat as "raining"

    function normalizeProb(p) {
      if (p == null) return 0;
      const n = Number(p);
      if (isNaN(n)) return 0;
      return n <= 1 ? Math.round(n * 100) : Math.round(n);
    }

    function updateRainMessage(weather) {
      try {
        const msgEl = document.querySelector('.condition') || document.getElementById('weather-message');
        if (!msgEl) return;

        const precipProb = normalizeProb(weather && (weather.precipProbability ?? weather.precipProb ?? weather.precip))
        const desc = ((weather && (weather.summary || weather.description)) || '').toString().toLowerCase();

        if (precipProb >= RAIN_THRESHOLD || desc.includes('rain')) {
          msgEl.textContent = "It's raining here";
          document.body.setAttribute('data-weather','rain');
        } else if (precipProb > 0) {
          msgEl.textContent = `Chance of rain: ${precipProb}%`;
        }
      } catch (e) {
        // silent fail
        console.error('updateRainMessage error', e);
      }
    }

    // expose for existing code to call
    window.updateRainMessage = updateRainMessage;

    // If a global weather object already exists, try to call it
    if (window.weather) updateRainMessage(window.weather);
    if (window.weatherData) updateRainMessage(window.weatherData);
  })();
  </script>
